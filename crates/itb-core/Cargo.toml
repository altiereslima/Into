[package]
name = "itb-core"
version = "0.6.0"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "itb_core"
path = "src/lib.rs"

[features]
default = []
sdl2-backend = ["dep:sdl2"]

[dependencies]
sdl2 = { version = "0.38.0", optional = true, default-features = false, features = ["bundled", "static-link"] }

[[bin]]
name = "input_lab"
path = "src/bin/input_lab.rs"
required-features = ["sdl2-backend"]
