[package]
name = "itb-lua"
version = "0.6.0"
edition = "2021"
publish = false
description = "Host Lua 5.1 que executa os scripts ORIGINAIS do Into the Breach sobre o motor Rust"

[dependencies]
itb-core = { path = "../itb-core" }
mlua = { version = "0.12.2", features = ["lua51", "vendored"] }

[[bin]]
name = "itb-boot"
path = "src/bin/itb_boot.rs"

[[bin]]
name = "itb-weapon"
path = "src/bin/itb_weapon.rs"

[[bin]]
name = "itb-map"
path = "src/bin/itb_map.rs"

[[bin]]
name = "itb-diff"
path = "src/bin/itb_diff.rs"
